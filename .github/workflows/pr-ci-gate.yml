name: PR CI Gate
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  biome:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-node-npm
      - run: npx biome ci --reporter=github .

  actionlint:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: ./scripts/actionlint.sh -color
        env:
          GH_TOKEN: ${{ github.token }}

  infra-build:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-node-npm
        with:
          working-directory: infra
      - working-directory: infra
        run: npm run build

  infra-test:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-node-npm
        with:
          working-directory: infra
      - working-directory: infra
        run: npm test

  cdk-synth:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-node-npm
        with:
          working-directory: infra
      - working-directory: infra
        run: npx cdk synth
        env:
          AWS_LANDING_PRODUCTION_ACCOUNT_ID: '111111111111'
          APEX_DOMAIN_NAME: example.com
          BLOG_DOMAIN_NAME: blog.example.com

  knip:
    strategy:
      fail-fast: false
      matrix:
        workspace: [".", "infra"]
        mode: ["default", "production"]
    runs-on: ubuntu-slim
    env:
      KNIP_DISABLE_RAW_TRANSFER: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-node-npm
      - if: ${{ matrix.workspace != '.' }}
        uses: ./.github/actions/setup-node-npm
        with:
          working-directory: ${{ matrix.workspace }}
      - name: knip (${{ matrix.workspace }}, ${{ matrix.mode }})
        run: >-
          npx knip --workspace ${{ matrix.workspace }}
          ${{ matrix.mode == 'production' && '--production --strict' || '' }}
          --reporter github-actions

  pr-ci-gate:
    needs:
      - biome
      - actionlint
      - infra-build
      - infra-test
      - cdk-synth
      - knip
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-slim
    steps:
      - name: Verify CI results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e '
            all(
              .[];
              .result == "success" or .result == "skipped"
            )
          '
